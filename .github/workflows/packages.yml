name: Build and publish packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Sign packages and deploy GitHub Pages
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - run: bash scripts/check-boundaries.sh
      - name: Run packaging script tests
        run: python3 -m unittest discover -s tests -v

  build:
    needs: boundaries
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package:
          - calamares
          - linxira-artwork
          - linxira-hooks
          - linxira-keyring
          - shelly
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Build in clean Arch container
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          docker run --rm \
            -e PACKAGE="$PACKAGE" \
            -v "$PWD:/workspace" \
            archlinux:base-devel bash -euxo pipefail -c '
              pacman -Syu --noconfirm git sudo
              useradd --create-home builder
              printf "builder ALL=(ALL) NOPASSWD: ALL\n" >/etc/sudoers.d/builder
              chown -R builder:builder "/workspace/packages/$PACKAGE"
              su builder -c "cd /workspace/packages/$PACKAGE && makepkg --syncdeps --noconfirm --clean --cleanbuild"
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.package }}
          path: packages/${{ matrix.package }}/*.pkg.tar.zst
          if-no-files-found: error

  system-stack:
    needs: boundaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Build dependency-ordered system packages
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            archlinux:base-devel bash -euxo pipefail -c '
              pacman -Syu --noconfirm git sudo
              useradd --create-home builder
              printf "builder ALL=(ALL) NOPASSWD: ALL\n" >/etc/sudoers.d/builder
              packages=(
                linxira-bio-sdk
                linxira-catalog
                linxira-hwd-detector
                linxira-components
                linxira-completion-agent
                linxira-hardware-driver-manager
                linxira-recovery-diagnostics
                # linxira-crash-watch: 2026-10-24 重新入链 —— v0.1.1 的 tag 提交含
                # diagnose-crash 技能与 user preset, check() 的 wheel 断言可满足。
                linxira-crash-watch
                linxira-config-hub
                linxira-component-manager
                linxira-gaming-manager
                linxira-package-center
                linxira-update
                linxira-welcome
                linxira-wiki
                linxira-kernel-manager
              )
              for package in "${packages[@]}"; do
                chown -R builder:builder "/workspace/packages/$package"
                su builder -c "cd /workspace/packages/$package && makepkg --syncdeps --noconfirm --clean --cleanbuild"
                pacman -U --noconfirm /workspace/packages/$package/*.pkg.tar.zst
              done
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linxira-system-stack
          path: |
            packages/linxira-catalog/*.pkg.tar.zst
            packages/linxira-components/*.pkg.tar.zst
            packages/linxira-completion-agent/*.pkg.tar.zst
            packages/linxira-hwd-detector/*.pkg.tar.zst
            packages/linxira-hardware-driver-manager/*.pkg.tar.zst
            packages/linxira-bio-sdk/*.pkg.tar.zst
            packages/linxira-recovery-diagnostics/*.pkg.tar.zst
            packages/linxira-crash-watch/*.pkg.tar.zst
            packages/linxira-config-hub/*.pkg.tar.zst
            packages/linxira-component-manager/*.pkg.tar.zst
            packages/linxira-gaming-manager/*.pkg.tar.zst
            packages/linxira-package-center/*.pkg.tar.zst
            packages/linxira-update/*.pkg.tar.zst
            packages/linxira-welcome/*.pkg.tar.zst
            packages/linxira-wiki/*.pkg.tar.zst
            packages/linxira-kernel-manager/*.pkg.tar.zst
          if-no-files-found: error

  zeta-stack:
    # PR 只验证构建, 不发布滚动仓库(否则任何人都能通过 PR 改动发布内容)
    if: github.event_name != 'pull_request'
    # [linxira-zeta] pacman 仓库: 构建->签名->repo-add->上传到本仓库滚动 Release 资产。
    # 绕开 linxira-packages git 的 100MB 限制(GitHub Release 资产上限 2GB);
    # pacman Server 指向 releases/download/zeta-repo(固定 tag, 不随最新 release 漂移)。
    # 可选件(CLI/IDE)上游缺资产时自动跳过; 完整版(linxira-zeta)构建失败则 job 失败。
    needs: [boundaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Build available zeta packages (missing assets auto-skip)
        run: |
          docker run --rm -v "$PWD:/workspace" \
            archlinux:base-devel bash -euxo pipefail -c '
              pacman -Syu --noconfirm git sudo
              useradd --create-home builder
              printf "builder ALL=(ALL) NOPASSWD: ALL\n" >/etc/sudoers.d/builder
              cd /workspace
              # 源文件下载到独立目录: 完整版的源资产名与产出一致, 放在当前目录
              # 会被 makepkg 当成"包已构建"(实际事故: exit 13)。
              export SRCDEST=/tmp/srcdest
              install -d -o builder -g builder "$SRCDEST"
              # 可选件: 上游没发对应资产时跳过, 不阻断仓库发布
              for pkg in linxira-zeta-c-bin linxira-zeta-ide; do
                chown -R builder:builder packages/$pkg
                if su builder -c "cd packages/$pkg && makepkg --syncdeps --noconfirm --clean --cleanbuild"; then
                  echo "BUILT: $pkg"
                else
                  rm -f packages/$pkg/*.pkg.tar.zst
                  echo "SKIP: $pkg (source asset unavailable)"
                fi
              done
              # 完整版是仓库的主产物: 构建失败必须让整个 job 失败, 不能静默跳过
              chown -R builder:builder packages/linxira-zeta
              su builder -c "cd packages/linxira-zeta && makepkg --syncdeps --noconfirm --clean --cleanbuild"
              echo "BUILT: linxira-zeta (complete)"
              install -d /workspace/zeta-repo
              cp packages/linxira-zeta*/*.pkg.tar.zst /workspace/zeta-repo/ 2>/dev/null || true
              ls -la /workspace/zeta-repo/
            '
      - name: Sign packages and build zeta repo db
        env:
          LINXIRA_GPG_PRIVATE_KEY: ${{ secrets.LINXIRA_GPG_PRIVATE_KEY }}
          LINXIRA_GPG_FINGERPRINT: ${{ secrets.LINXIRA_GPG_FINGERPRINT }}
          LINXIRA_GPG_PASSPHRASE: ${{ secrets.LINXIRA_GPG_PASSPHRASE }}
        run: |
          if [ -z "$(ls zeta-repo/*.pkg.tar.zst 2>/dev/null)" ]; then
            echo "no zeta packages built - nothing to sign"; exit 0
          fi
          docker run --rm -v "$PWD:/workspace" \
            -e LINXIRA_GPG_PRIVATE_KEY -e LINXIRA_GPG_FINGERPRINT -e LINXIRA_GPG_PASSPHRASE \
            archlinux:base bash -euxo pipefail -c '
              pacman -Syu --noconfirm gnupg pacman
              cd /workspace/zeta-repo
              echo "$LINXIRA_GPG_PRIVATE_KEY" | gpg --batch --import
              for f in *.pkg.tar.zst; do
                gpg --batch --yes --pinentry-mode loopback \
                    --passphrase "$LINXIRA_GPG_PASSPHRASE" \
                    --local-user "$LINXIRA_GPG_FINGERPRINT" \
                    --detach-sign -o "$f.sig" "$f"
              done
              # 仓库段名必须与库文件名一致(pacman 按段名取 <段名>.db): 目标系统
              # 用 [linxira-zeta] 段, 所以这里必须是 linxira-zeta.db*, 不能叫 linxira.db。
              repo-add linxira-zeta.db.tar.zst *.pkg.tar.zst
              ln -sf linxira-zeta.db.tar.zst linxira-zeta.db
              gpg --batch --yes --pinentry-mode loopback \
                  --passphrase "$LINXIRA_GPG_PASSPHRASE" \
                  --local-user "$LINXIRA_GPG_FINGERPRINT" \
                  --detach-sign linxira-zeta.db
            '
      - name: Publish rolling zeta-repo Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f zeta-repo/linxira-zeta.db.tar.zst ]; then
            echo "no zeta db - skip release"; exit 0
          fi
          ls zeta-repo/
          # 不删除旧 release: 直接覆盖资产。中途失败时旧文件仍在, 不会出现
          # "仓库整个消失"的窗口; 旧版本包文件也保留(可按版本重装)。
          if ! gh release view zeta-repo >/dev/null 2>&1; then
            gh release create zeta-repo --title "[linxira-zeta] pacman repo (rolling)" \
              --notes "Rolling pacman repo for the Zeta suite. Server: https://github.com/Linxira-OS/packages/releases/download/zeta-repo"
          fi
          shopt -s nullglob
          # 1) 先传包文件
          pkgs=(zeta-repo/*.pkg.tar.zst zeta-repo/*.pkg.tar.zst.sig)
          ((${#pkgs[@]})) && gh release upload zeta-repo "${pkgs[@]}" --clobber
          # 2) 再传索引(索引最后落地, 避免指向尚未上传的文件)
          idx=()
          for f in linxira-zeta.files linxira-zeta.files.tar.zst linxira-zeta.db \
                   linxira-zeta.db.tar.zst linxira-zeta.db.sig linxira-zeta.db.tar.zst.sig \
                   linxira-zeta.files.sig linxira-zeta.files.tar.zst.sig; do
            [[ -e "zeta-repo/$f" ]] && idx+=("zeta-repo/$f")
          done
          ((${#idx[@]})) && gh release upload zeta-repo "${idx[@]}" --clobber
          # 3) 清理本轮不再产出的旧资产(例如退役的 zetawork), 保持索引与文件一致
          keep=" $(cd zeta-repo && ls -1 | tr '\n' ' ') "
          for name in $(gh release view zeta-repo --json assets -q '.assets[].name'); do
            case "$keep" in *" $name "*) ;; *) echo "drop stale asset: $name"; gh release delete-asset zeta-repo "$name" -y ;; esac
          done

  publish:
    # always(): zeta 构建失败不应阻断主仓发布; 此时 Pages 沿用上一次的 zeta 资产。
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish) ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, 'chore(bump')))) &&
      needs.build.result == 'success' && needs.system-stack.result == 'success'
    needs: [build, system-stack, zeta-stack]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnupg
          docker pull archlinux:base
      - name: Sign packages and build repository
        env:
          LINXIRA_GPG_PRIVATE_KEY: ${{ secrets.LINXIRA_GPG_PRIVATE_KEY }}
          LINXIRA_GPG_FINGERPRINT: ${{ secrets.LINXIRA_GPG_FINGERPRINT }}
          LINXIRA_GPG_PASSPHRASE: ${{ secrets.LINXIRA_GPG_PASSPHRASE }}
        run: |
          docker run --rm \
            -e LINXIRA_GPG_PRIVATE_KEY \
            -e LINXIRA_GPG_FINGERPRINT \
            -e LINXIRA_GPG_PASSPHRASE \
            -v "$PWD:/workspace" \
            archlinux:base bash -euxo pipefail -c '
              pacman -Syu --noconfirm gnupg pacman
              cd /workspace
              scripts/publish-repo.sh public
            '
      - name: Include zeta repo in Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 与主仓同域(linxira-os.github.io): github.com 直连在部分网络会超时,
          # 独立 Release 仓只能作为回退 Server。zeta 包不进 git 镜像(>100MB)。
          install -d public/zeta/x86_64
          gh release download zeta-repo --pattern '*' --dir public/zeta/x86_64 --clobber
          ls -lh public/zeta/x86_64 | head
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
      - name: Sync signed repo to Linxira-OS/linxira-packages
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          LINXIRA_CI_TOKEN: ${{ secrets.LINXIRA_CI_TOKEN }}
          LINXIRA_GPG_PRIVATE_KEY: ${{ secrets.LINXIRA_GPG_PRIVATE_KEY }}
          LINXIRA_GPG_FINGERPRINT: ${{ secrets.LINXIRA_GPG_FINGERPRINT }}
          LINXIRA_GPG_PASSPHRASE: ${{ secrets.LINXIRA_GPG_PASSPHRASE }}
          GH_TOKEN: ${{ secrets.LINXIRA_CI_TOKEN }}
        run: |
          bash scripts/deploy-to-linxira-packages.sh "$(git log -1 --pretty=%s)"
