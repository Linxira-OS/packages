name: Build and publish packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Sign packages and deploy GitHub Pages
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-boundaries.sh

  build:
    needs: boundaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - linxira-artwork
          - linxira-hello
          - linxira-hooks
    steps:
      - uses: actions/checkout@v4
      - name: Build in clean Arch chroot
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          docker run --rm --privileged \
            -e PACKAGE="$PACKAGE" \
            -v "$PWD:/workspace" \
            archlinux:base-devel bash -euxo pipefail -c '
              pacman -Syu --noconfirm devtools git sudo
              useradd --create-home builder
              printf "builder ALL=(ALL) NOPASSWD: ALL\n" >/etc/sudoers.d/builder
              chown -R builder:builder /workspace
              su builder -c "cd /workspace/packages/$PACKAGE && extra-x86_64-build"
            '
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: packages/${{ matrix.package }}/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnupg
          docker pull archlinux:base
      - name: Sign packages and build repository
        env:
          LINXIRA_GPG_PRIVATE_KEY: ${{ secrets.LINXIRA_GPG_PRIVATE_KEY }}
          LINXIRA_GPG_FINGERPRINT: ${{ secrets.LINXIRA_GPG_FINGERPRINT }}
        run: |
          docker run --rm \
            -e LINXIRA_GPG_PRIVATE_KEY \
            -e LINXIRA_GPG_FINGERPRINT \
            -v "$PWD:/workspace" \
            archlinux:base bash -euxo pipefail -c '
              pacman -Sy --noconfirm gnupg pacman
              cd /workspace
              scripts/publish-repo.sh public
            '
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
